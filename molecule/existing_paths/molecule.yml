---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: bouola_compose_deploy_${name:-${image:-debian}-${tag:-latest}-${scenario:-existing-paths}
    image: ${image:-debian}:${tag:-latest}
    privileged: true
    pre_build_image: true
    tty: true

provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible/tmp
  env:
    ANSIBLE_FORCE_COLOR: "true"
  options:
    v: true

verifier:
  name: ansible
