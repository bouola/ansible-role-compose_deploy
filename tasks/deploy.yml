---
- name: "Reconcile Compose projects"
  community.docker.docker_compose_v2:
    project_name: "{{ compose_deploy_project.name | default(omit) }}"
    project_src: "{{ compose_deploy_project.dest }}"
    state: present
  loop: "{{ compose_deploy_projects }}"
  loop_control:
    loop_var: compose_deploy_project
    label: "{{ compose_deploy_project.dest }}"
